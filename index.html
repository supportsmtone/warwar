<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHADDO</title>
<link rel="icon" href="assets/art/shaddo_logo.png">
<link rel="stylesheet" href="tower.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/"
} }
</script>
</head>
<body data-mode="tower">
<div id="stage" aria-label="5층 사옥 3D 화면"></div>
<div id="loading"><div class="ld"><b>SHADDO</b><span>사옥 불러오는 중…</span><i></i></div></div>

<header class="hud" id="top">
  <div class="brand"><span class="mark"></span><div><b id="bname">SHADDO</b><small><span id="ceo"></span><span id="clock">—</span></small></div></div>
  <div id="views" class="views" aria-label="카드 표시·숨김"></div>
  <div id="pills" class="pills"></div>
  <div class="tot" id="tot"></div>
</header>

<aside class="hud" id="companies" aria-label="회사별 현황"></aside>

<nav class="hud" id="rail" aria-label="층 선택"></nav>

<aside class="hud" id="panel" aria-label="근무 현황">
  <button id="sheet-toggle" aria-label="패널 접기·펴기"><i></i></button>
  <button id="panel-hide" title="현황 패널 숨기기" aria-label="현황 패널 숨기기">›</button>
  <div id="panel-head"></div>
  <div id="panel-body"></div>
  <div id="panel-foot"><span id="conn">연결 중…</span><a href="classic.html">이전 화면</a></div>
</aside>

<button class="hud" id="panel-show" title="현황 패널 표시" aria-label="현황 패널 표시">‹ 현황</button>

<div class="hud" id="hint"><span class="t-tower">층을 누르면 안으로 들어갑니다 · 드래그 회전 · 휠 확대</span><span class="t-floor">사람을 누르면 가까이 봅니다 · Esc 건물 전체</span></div>
<div id="tip" hidden></div>
<div id="carcard" hidden></div>

<div id="modal" class="modal" hidden><div class="modal-box"><button id="modal-close" class="close" aria-label="닫기">×</button><div id="modal-body" class="md"></div></div></div>

<script src="ui.js"></script>
<script type="module" src="tower.js"></script>
</body>
</html>
